
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-data-pipeline"
version = "0.1.0"
description = "A stock market data engineering pipeline for extraction, transformation, validation, and analytics."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "PyYAML",
    "SQLAlchemy",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
spark = [
    "pyspark>=4.2,<5",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
dbt = [
    "dbt-core>=1.12,<1.13",
    "dbt-postgres>=1.11,<2",
]
dashboard = [
    "streamlit>=1.40,<2",
    "plotly>=5,<7",
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "spark"]
addopts = "-p no:cacheprovider"
